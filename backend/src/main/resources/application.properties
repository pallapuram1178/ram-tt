server.port=${PORT:5000}

spring.application.name=servicedesk-pro-backend

# Embedded Persistent H2 Database
spring.datasource.url=jdbc:h2:file:./data/servicedesk;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console (for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=servicedesk_pro_super_secret_jwt_key_2026_x89f_enterprise_security_jwt_secret_token
app.jwt.expiration-ms=604800000

# AI Engine Configuration
app.ai.provider=mock
# app.ai.gemini-api-key=your_gemini_key_here
# app.ai.openai-api-key=your_openai_key_here

# Jackson settings
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=always
